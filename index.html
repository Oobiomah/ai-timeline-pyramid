

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Insights: The Timeline Pyramid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>AI Insights: The Timeline Pyramid</h1>
    <p>An interactive journey into the history and evolution of artificial intelligence</p>
        

    <div class="main-layout">

        <div class="pyramid">

        <button class="pyramid-layer layer-5" data-layer="5">
            Future AI
        </button>

        <button class="pyramid-layer layer-4" data-layer="4">
            Generative AI & LLMs
        </button>

        <button class="pyramid-layer layer-3" data-layer="3">
            Machine Learning & Deep Learning
        </button>

        <button class="pyramid-layer layer-2" data-layer="2">
            Symbolic AI & Early Systems
        </button>

        <button class="pyramid-layer layer-1" data-layer="1">
            Foundations of AI
        </button>

    </div>

        <!-- Milestone display panel -->

        <section id="milestone-panel" class="milestone-panel" hidden>

            <button id="close-panel" class="close-button" aria-label="Close panel">
                &times;
            </button>

            <div id="milestone-content"></div>

        </section>

</div>

<section class="legend">

    <h2>AI Historical Periods</h2>

    <div class="legend-items">

        <div class="legend-item">
            <span class="legend-colour blue"></span>
            <span>Foundations of AI</span>
        </div>

        <div class="legend-item">
            <span class="legend-colour purple"></span>
            <span>Symbolic AI and Early Systems</span>
        </div>

        <div class="legend-item">
            <span class="legend-colour green"></span>
            <span>Machine Learning and Deep Learning</span>
        </div>

        <div class="legend-item">
            <span class="legend-colour pink"></span>
            <span>Generative AI and LLMs</span>
        </div>

        <div class="legend-item">
            <span class="legend-colour grey"></span>
            <span>Future AI</span>
        </div>

    </div>

</section>

<script src="script.js"></script>
</body>
</html>
